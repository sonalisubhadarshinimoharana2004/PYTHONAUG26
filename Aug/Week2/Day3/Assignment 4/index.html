<!DOCTYPE html>
<html>
<head>
    <title>Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">
        <h2>Assess</h2>
        <p>Test your design skills and establish benchmarks.</p>
    </div>

    <div class="card">
        <h2>Learn</h2>
        <p>Access a design library of course.</p>
    </div>

    <div class="card">
        <h2>Showcase</h2>
        <p>
            Every skill you learn is automatically recorded on profile.
            Show it off and see how you stack up to other designers.
        </p>
    </div>

</div>

</body>
</html>
