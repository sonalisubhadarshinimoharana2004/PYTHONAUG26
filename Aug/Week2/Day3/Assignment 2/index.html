<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DO vs DON'T Form Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="comparison-container">
    
    <!-- DO SECTION -->
    <div class="card-column">
      <h2 class="section-title">DO:</h2>
      <div class="form-card">
        
        <div class="form-group do-group">
          <label for="do-name">Name</label>
          <input type="text" id="do-name" placeholder="Name">
        </div>

        <div class="form-group do-group">
          <label for="do-email">Email</label>
          <input type="email" id="do-email" placeholder="Email">
        </div>

        <div class="form-group do-group">
          <label for="do-company">Company</label>
          <input type="text" id="do-company" placeholder="Company">
        </div>

      </div>
    </div>

    <!-- DON'T SECTION -->
    <div class="card-column">
      <h2 class="section-title">DON'T:</h2>
      <div class="form-card">
        
        <div class="form-group dont-group">
          <label for="dont-name">Name</label>
          <input type="text" id="dont-name" placeholder="Name">
        </div>

        <div class="form-group dont-group">
          <label for="dont-email">Email</label>
          <input type="email" id="dont-email" placeholder="Email">
        </div>

        <div class="form-group dont-group">
          <label for="dont-company">Company</label>
          <input type="text" id="dont-company" placeholder="Company">
        </div>

      </div>
    </div>

  </div>

</body>
</html>
