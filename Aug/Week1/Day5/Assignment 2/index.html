<!DOCTYPE html>
<html>
<head>
    <title>HTML Assignment</title>

    <style>
        body {
            background-color: black;
            color: white;
        }

        img {
            height: 150px;
            width: 150px;
            border: 2px solid white;
        }
    </style>
</head>

<body>

    <!-- Q1: All Six Headings and Horizontal Rule -->

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <hr>

    <!-- Q2: Formatting Tags -->

    <p>
        This is <b>Bold</b> text.
        This is <i>Italic</i> text.
        This is <u>Underlined</u> text.
        This is <s>Strike-through</s> text.
        Water is H<sub>2</sub>O.
        Einstein's equation is E = mc<sup>2</sup>.
    </p>

    <!-- Q3: Image -->

    <img src="abc.jpg" alt="ABC Image" align="left">

</body>
</html>
