<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login and Registration Form</title>
</head>
<body>

    <!-- ================= 1. LOGIN FORM ================= -->
    <section id="login">
        <h1>Login form using HTML</h1>
        
        <h3>Sign in</h3>
        <p>Sign in with your username and password</p>

        <form action="#" method="POST">
            <p>
                <label for="login-username">Your username</label>
                <input type="text" id="login-username" name="username" placeholder="Enter Username">
            </p>
            <p>
                <label for="login-password">Your password</label>
                <input type="password" id="login-password" name="password" placeholder="Enter Password">
            </p>
            <p>
                <input type="submit" value="Login">
            </p>
        </form>

        <p>Not a member? <a href="#registration">Register here!</a></p>
    </section>

    <hr>

    <!-- ================= 2. STUDENT REGISTRATION FORM ================= -->
    <section id="registration">
        <table border="1" cellpadding="10" bgcolor="#00b3a4">
            <tr>
                <td>
                    <h2 align="center">Student Registration Form</h2>

                    <form action="#" method="POST" enctype="multipart/form-data">
                        <p>
                            <label for="name">Name : </label>
                            <input type="text" id="name" name="name" placeholder="Enter full name">
                        </p>

                        <p>
                            <label for="fname">Father's Name : </label>
                            <input type="text" id="fname" name="father_name">
                        </p>

                        <p>
                            <label for="mname">Mother's Name : </label>
                            <input type="text" id="mname" name="mother_name">
                        </p>

                        <p>
                            <label for="phone">Phone Number : </label>
                            <input type="text" id="phone" name="phone" placeholder="017xxxxxxxxx">
                        </p>

                        <p>
                            <label for="email">Email : </label>
                            <input type="email" id="email" name="email" placeholder="sample@example.com">
                        </p>

                        <p>
                            Gender : 
                            <input type="radio" id="male" name="gender" value="Male">
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="gender" value="Female">
                            <label for="female">Female</label>
                            <input type="radio" id="other" name="gender" value="Other">
                            <label for="other">Other</label>
                        </p>

                        <p>
                            Date Of Birth : 
                            <input type="text" name="day" size="2"> - 
                            <input type="text" name="month" size="2"> - 
                            <input type="text" name="year" size="4">
                            <i>(dd-mm-yyyy)</i>
                        </p>

                        <p>
                            <label for="address">Address : </label>
                            <input type="text" id="address" name="address" value="Street:-  House:-  Road:-" size="40">
                        </p>

                        <p>
                            <label for="blood">Blood Group : </label>
                            <select id="blood" name="blood_group">
                                <option value="">Select</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </p>

                        <p>
                            Department : 
                            <input type="radio" id="cse" name="department" value="CSE">
                            <label for="cse">CSE</label>
                            <input type="radio" id="eee" name="department" value="EEE">
                            <label for="eee">EEE</label>
                            <input type="radio" id="bba" name="department" value="BBA">
                            <label for="bba">BBA</label>
                        </p>

                        <p>
                            Course : 
                            <input type="checkbox" id="c" name="course" value="C">
                            <label for="c">C</label>
                            <input type="checkbox" id="cpp" name="course" value="C++">
                            <label for="cpp">C++</label>
                            <input type="checkbox" id="java" name="course" value="Java">
                            <label for="java">Java</label>
                            <input type="checkbox" id="ai" name="course" value="AI">
                            <label for="ai">AI</label>
                            <input type="checkbox" id="ml" name="course" value="Machine learning">
                            <label for="ml">Machine learning</label>
                            <input type="checkbox" id="robotics" name="course" value="Robotics">
                            <label for="robotics">Robotics</label>
                        </p>

                        <p>
                            <label for="photo">Photo : </label>
                            <input type="file" id="photo" name="photo">
                        </p>

                        <p>
                            <input type="submit" value="Submit">
                            <input type="reset" value="Reset">
                        </p>
                    </form>

                    <p><a href="#login">Back to Login</a></p>
                </td>
            </tr>
        </table>
    </section>

</body>
</html>
